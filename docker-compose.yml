services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

  k6:
    image: grafana/k6:2.4.0
    profiles: [loadtest]
    working_dir: /scripts
    command:
      [
        'run',
        '--include-system-env-vars',
        '/scripts/${K6_SCENARIO:-create-urls}.js',
      ]
    volumes:
      - ./k6:/scripts:ro
      - ./k6/results:/results
    environment:
      BASE_URL: ${BASE_URL:-http://host.docker.internal:3000}
      K6_SCENARIO: ${K6_SCENARIO:-create-urls}
      K6_PROFILE: ${K6_PROFILE:-baseline}
      K6_RATE: ${K6_RATE:-20}
      K6_VUS: ${K6_VUS:-10}
      K6_MAX_VUS: ${K6_MAX_VUS:-}
      K6_DURATION: ${K6_DURATION:-1m}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
